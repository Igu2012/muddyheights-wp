<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Muddy Heights</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico?v=2">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
      <div id="mobile-controls" aria-label="Mobile game controls">
        <div class="mobile-left-controls">
          <button class="touch-button" data-key="KeyA" aria-label="Move left">◀</button>
          <button class="touch-button" data-key="KeyD" aria-label="Move right">▶</button>
        </div>
        <div class="mobile-right-controls">
          <button class="touch-button touch-action" data-key="KeyW" aria-label="Jump">▲</button>
          <button class="touch-button touch-space" data-key="Space" aria-label="Start or action">START</button>
        </div>
      </div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");
      const mobileControls = document.querySelector("#mobile-controls");
      let unityInstance = null;

      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        div.style.cssText = type === "error"
          ? "background:#b00020;color:white;padding:10px"
          : "background:#fff3cd;color:#111;padding:10px";
        warningBanner.appendChild(div);
        warningBanner.style.display = "block";
        if (type !== "error") setTimeout(() => div.remove(), 5000);
      }

      function sendKey(key, type) {
        const target = document.activeElement || canvas;
        const keyInfo = {
          KeyA: { key: "a", code: "KeyA", keyCode: 65 },
          KeyD: { key: "d", code: "KeyD", keyCode: 68 },
          KeyW: { key: "w", code: "KeyW", keyCode: 87 },
          Space: { key: " ", code: "Space", keyCode: 32 }
        }[key] || { key, code: key, keyCode: 0 };
        target.dispatchEvent(new KeyboardEvent(type, {
          key: keyInfo.key,
          code: keyInfo.code,
          keyCode: keyInfo.keyCode,
          which: keyInfo.keyCode,
          bubbles: true,
          cancelable: true
        }));
        window.dispatchEvent(new KeyboardEvent(type, { key: keyInfo.key, code: keyInfo.code, keyCode: keyInfo.keyCode, which: keyInfo.keyCode, bubbles: true }));
      }

      document.querySelectorAll(".touch-button").forEach(button => {
        const key = button.dataset.key;
        const press = event => {
          event.preventDefault();
          button.setPointerCapture?.(event.pointerId);
          sendKey(key, "keydown");
        };
        const release = event => {
          event.preventDefault();
          sendKey(key, "keyup");
        };
        button.addEventListener("pointerdown", press, { passive: false });
        button.addEventListener("pointerup", release, { passive: false });
        button.addEventListener("pointercancel", release, { passive: false });
        button.addEventListener("pointerleave", release, { passive: false });
      });

      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/Muddy Heights.data",
        frameworkUrl: buildUrl + "/Muddy Heights.framework.js",
        codeUrl: buildUrl + "/Muddy Heights.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Muddy Heights",
        productVersion: "",
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";
      const script = document.createElement("script");
      script.src = buildUrl + "/Muddy Heights.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(instance => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          if (window.matchMedia("(pointer: coarse)").matches) mobileControls.classList.add("visible");
          canvas.focus();
          // The original title screen waits for Space; continue automatically on all devices.
          setTimeout(() => {
            sendKey("Space", "keydown");
            setTimeout(() => sendKey("Space", "keyup"), 80);
          }, 350);
        }).catch(message => unityShowBanner(message, "error"));
      };
      script.onerror = () => unityShowBanner("Unable to load the game.", "error");
      document.body.appendChild(script);
    </script>
  </body>
</html>
