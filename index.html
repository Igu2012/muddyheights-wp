<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>Muddy Heights</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico?v=2">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");
      let unityInstance = null;

      function unityShowBanner(msg, type) {
        const div = document.createElement("div");
        div.textContent = msg;
        div.style.cssText = type === "error"
          ? "background:#b00020;color:white;padding:10px"
          : "background:#fff3cd;color:#111;padding:10px";
        warningBanner.appendChild(div);
        warningBanner.style.display = "block";
        if (type !== "error") setTimeout(() => div.remove(), 5000);
      }

      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/Muddy Heights.data",
        frameworkUrl: buildUrl + "/Muddy Heights.framework.js",
        codeUrl: buildUrl + "/Muddy Heights.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Muddy Heights",
        productVersion: "",
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";
      const script = document.createElement("script");
      script.src = buildUrl + "/Muddy Heights.loader.js";
      script.onload = () => {
        createUnityInstance(canvas, config, progress => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(instance => {
          unityInstance = instance;
          loadingBar.style.display = "none";
          canvas.focus();
          // The original title screen waits for Space; continue automatically on all devices.
          setTimeout(() => {
            canvas.dispatchEvent(new KeyboardEvent("keydown", { key: " ", code: "Space", keyCode: 32, which: 32, bubbles: true }));
            setTimeout(() => canvas.dispatchEvent(new KeyboardEvent("keyup", { key: " ", code: "Space", keyCode: 32, which: 32, bubbles: true })), 80);
          }, 350);
        }).catch(message => unityShowBanner(message, "error"));
      };
      script.onerror = () => unityShowBanner("Unable to load the game.", "error");
      document.body.appendChild(script);
    </script>
  </body>
</html>
